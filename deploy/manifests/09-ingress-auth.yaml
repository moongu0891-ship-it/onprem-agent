# 09장: 08장의 Ingress 에 기본 인증(Basic Auth, Secret basic-auth 는 09-gateway.sh 가 만든다)과 분당 요청 제한을 더한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: lab
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/auth-type: basic                 # 로그인 — 실제 클라우드의 Cognito·SSO 자리
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "사내 AI 상담"
    nginx.ingress.kubernetes.io/limit-rps: "5"                   # 한 주소에서 초당 5 요청(순간 허용 5×5) 넘으면 503
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [console.local]
      secretName: console-tls
  rules:
    - host: console.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: console, port: {number: 80}}}
