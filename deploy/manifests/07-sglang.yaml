# 07장: 모델 서버(SGLang · Qwen3-4B(FP8))를 GPU Pod 로. 가중치는 PVC(models)에 — 07-download.yaml 의 Job 이 한 번 받아 둔다.
# 3주차 serving/compose.yml 의 sglang-4b 프로필과 같은 실행 인자(접두사 캐시 켬, CUDA 그래프 상한 16, 생각 모드는 요청이 정함) + attention 백엔드 triton(C11).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: lab
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}    # minikube 의 기본 StorageClass(standard, 노드 안 hostpath). minikube stop 뒤에도 남고 delete 면 사라진다
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang
  namespace: lab
  labels: {app: sglang}
spec:
  replicas: 1
  strategy: {type: Recreate}                 # GPU 가 하나라 옛 Pod 가 내려간 뒤 새 Pod 를 띄운다
  selector:
    matchLabels: {app: sglang}
  template:
    metadata:
      labels: {app: sglang}
    spec:
      hostIPC: true                          # compose 의 ipc: host — SGLang 의 프로세스 간 공유 메모리
      containers:
        - name: sglang
          image: lmsysorg/sglang:latest
          imagePullPolicy: IfNotPresent      # 03장처럼 minikube image load 로 넣어 두면 받지 않는다(10GB 급)
          command: ["python3", "-m", "sglang.launch_server"]
          args: ["--model-path", "Qwen/Qwen3-4B-FP8", "--served-model-name", "qwen3-4b",
                 "--host", "0.0.0.0", "--port", "30000", "--context-length", "8192", "--mem-fraction-static", "0.80",
                 "--tool-call-parser", "qwen", "--enable-cache-report", "--cuda-graph-max-bs-decode", "16",
                 "--attention-backend", "triton",          # flashinfer 의 즉석 컴파일을 피한다(C11)
                 "--cuda-graph-backend-prefill", "disabled",   # 새 SGLang 이 더한 prefill 그래프 42종 녹화는 끈다 — 3주차 설정(디코드 그래프만)에 맞춤
                 "--fp8-gemm-backend", "triton"]        # FP8 행렬곱을 sgl-kernel JIT(즉석 컴파일, 9GB 넘겨 OOM 반복) 대신 triton 으로(C11)
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: HF_HUB_OFFLINE, value: "1"}    # 가중치는 PVC 에 있다 — 인터넷을 보지 않는다
            - {name: MAX_JOBS, value: "2"}          # FP8 커널 즉석 컴파일(sm120 용, C11)의 동시 작업 수 — RAM 을 아낀다
          ports: [{containerPort: 30000, name: http}]
          resources:
            requests: {cpu: "1", memory: 3Gi, nvidia.com/gpu: 1}
            limits: {nvidia.com/gpu: 1, memory: 9Gi}   # 모자라면 노드가 아니라 이 컨테이너만 죽게(C11: 상한 없이 두자 노드 12GB 를 다 먹어 제어부가 멈췄다)
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: models, mountPath: /root/.cache/sglang, subPath: jit-cache}   # 즉석 컴파일 결과 보관 — 두 번째 시작부터는 컴파일 없음
            - {name: shm, mountPath: /dev/shm}
          startupProbe:                            # 첫 시작은 FP8 커널 즉석 컴파일(sm120 용)이 10분을 넘긴다 — 60회(10분)로 두자 컴파일 중에 죽여 되풀이됐다(C11). 캐시가 PVC 에 남으면 1~3분
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5                      # 이 SGLang 의 /health 는 토큰 하나를 실제로 생성해 1초를 넘긴다 — 기본 1초면 영원히 Ready 가 안 된다(C11)
            failureThreshold: 180                  # 30분
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}   # compose 의 shm_size: 8g 대신 4Gi(노드 메모리 몫)
---
apiVersion: v1
kind: Service
metadata:
  name: sglang
  namespace: lab
spec:
  selector: {app: sglang}
  ports: [{port: 30000, targetPort: http}]        # 상담 화면은 http://sglang:30000/v1 로 붙는다(04-console.yaml 의 ONPREM_MODEL_URL)
