# 07장: 모델 서버(SGLang · Qwen3-4B(FP8))를 GPU Pod 로. 가중치는 PVC(models)에 — 07-download.yaml 의 Job 이 한 번 받아 둔다.
# 3주차 serving/compose.yml 의 sglang-4b 프로필과 같은 실행 인자(접두사 캐시 켬, CUDA 그래프 상한 16, 생각 모드는 요청이 정함) + attention 백엔드 triton(C11).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: lab
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}    # minikube 의 기본 StorageClass(standard, 노드 안 hostpath). minikube stop 뒤에도 남고 delete 면 사라진다
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang
  namespace: lab
  labels: {app: sglang}
spec:
  replicas: 1
  strategy: {type: Recreate}                 # GPU 가 하나라 옛 Pod 가 내려간 뒤 새 Pod 를 띄운다
  selector:
    matchLabels: {app: sglang}
  template:
    metadata:
      labels: {app: sglang}
    spec:
      hostIPC: true                          # compose 의 ipc: host — SGLang 의 프로세스 간 공유 메모리
      containers:
        - name: sglang
          image: lmsysorg/sglang:latest
          imagePullPolicy: IfNotPresent      # 03장처럼 minikube image load 로 넣어 두면 받지 않는다(10GB 급)
          command: ["python3", "-m", "sglang.launch_server"]
          args: ["--model-path", "Qwen/Qwen3-4B-FP8", "--served-model-name", "qwen3-4b",
                 "--host", "0.0.0.0", "--port", "30000", "--context-length", "8192", "--mem-fraction-static", "0.80",
                 "--tool-call-parser", "qwen", "--enable-cache-report", "--cuda-graph-max-bs-decode", "16",
                 "--attention-backend", "triton"]   # flashinfer 는 RTX 5070 용 커널을 즉석 컴파일하며 RAM 을 다 먹었다(C11) — triton 은 컴파일 없음
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: HF_HUB_OFFLINE, value: "1"}    # 가중치는 PVC 에 있다 — 인터넷을 보지 않는다
          ports: [{containerPort: 30000, name: http}]
          resources:
            requests: {cpu: "1", memory: 3Gi, nvidia.com/gpu: 1}
            limits: {nvidia.com/gpu: 1, memory: 7Gi}   # 모자라면 노드가 아니라 이 컨테이너만 죽게(C11: 상한 없이 두자 노드 12GB 를 다 먹어 제어부가 멈췄다)
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
          startupProbe:                            # 모델 읽기·CUDA 그래프 준비에 1~3분 — 그동안은 죽이지 않는다
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}   # compose 의 shm_size: 8g 대신 4Gi(노드 메모리 몫)
---
apiVersion: v1
kind: Service
metadata:
  name: sglang
  namespace: lab
spec:
  selector: {app: sglang}
  ports: [{port: 30000, targetPort: http}]        # 상담 화면은 http://sglang:30000/v1 로 붙는다(04-console.yaml 의 ONPREM_MODEL_URL)
