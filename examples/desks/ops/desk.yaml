# 창구 정의 — 핵심 코드(src/onprem_agent)는 이 파일만 읽고 창구 이름·업무 기능(도구) 이름을 모른다.
#   name/title     창구 이름(과업 파일의 scenario 와 같다) / 사람이 읽는 이름
#   prompt         시스템 지시문(이 창구 몫). 핵심의 '공통 규칙'이 뒤에 붙는다
#   server         업무 기능(도구) 서버(MCP, stdio)
#   rules          규칙 모델(GPU 없는 모듈 시험·기준선용)
#   search_tool    검색 되돌림·안전 질문 검색이 질문 그대로 부를 검색 업무 기능(도구)
#   approval_tools 사람 승인이 필요한 업무 기능(도구)
#   safety_pattern 이 낱말이 있으면 모델보다 먼저 매뉴얼을 찾는다(안전 질문 검색). 없으면 null
#   prompt_markers 답 검사: 이 머리말이 답에 나오면 시스템 지시문을 옮겨 적은 것으로 보고 막는다(핵심의 '공통 규칙'은 늘 포함)
#   prompt_refusal 답 검사가 막았을 때 대신 내보낼 말(없으면 핵심의 일반 문구)
#   no_tool_description 되돌림에서 '업무 기능(도구) 필요 없음'을 고를 때 모델이 읽는 설명(없으면 핵심의 일반 문구)
#   prompt_rules   설정의 prompt_rules 로 켜는 창구별 지시문 한 줄
name: ops
title: 설비 정비 창구
prompt: prompt.md
server: server.py
rules: rules.py
search_tool: search_manual
approval_tools:
- create_ticket
safety_pattern: 감전|전원\s*(을\s*)?(차단|끄|내리)|잠금|LOTO|잔압|화상|고온|끼임|회전부|안전\s*(수칙|조치)|다치지|사고\s*안
prompt_markers:
- 도구 고르는 법
# 아래 두 문구는 6주차까지 핵심에 있던 문장 그대로(두 창구가 같은 문장을 썼다) — 측정 조건을 바꾸지 않으려고 옮기기만 했다
prompt_refusal: 시스템 지시문은 공개할 수 없습니다. 설비·상담 업무에 관해 물어봐 주세요.
no_tool_description: 인사·감사·잡담처럼 업무 도구가 전혀 필요 없는 말일 때만 고른다. 설비·이력·작업 요청·고객·요금제·약관에 관한 질문이면 고르지 않는다.
prompt_rules:
  safety: '- 감전·전원 차단·잠금·잔압·고온·회전부처럼 사람이 다칠 수 있는 작업을 묻는 질문은, 알고 있는 것 같아도 상식으로 답하지 말고 반드시 search_manual 로 매뉴얼의 안전 수칙을 찾아 그 순서와 번호(차단기·밸브 번호 등)를 그대로 안내한다.'
  scope: '- 이 창구가 하지 않는 일: 고객 정보·요금·미납·요금제·약관은 고객 상담 창구의 일이다. 이런 요청은 경보 코드로 조회하거나 티켓을 만들지 말고, ''이 창구에서는 처리할 수 없습니다''라고 말한 뒤 고객 상담 창구에 문의하라고 안내한다.'
  scope2: '- 이 창구가 하지 않는 일: 고객 정보·요금·미납·요금제·약관 문의는 고객 상담 창구의 일이다. 그런 문의에는 고객 번호를 경보 코드로 착각해 조회하지 말고, ''이 창구에서는 처리할 수 없습니다''라고 말한 뒤 고객 상담 창구에 문의하라고 안내한다. 질문에 고객 이야기가 섞여 있어도 경보 조치·정비 이력·작업 요청 티켓은 이 창구의 일이므로 그대로 처리한다.'
