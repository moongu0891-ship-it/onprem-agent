name: ci

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 설치
        run: pip install -e ".[chroma,serving,agent,dev]"
      - name: 단위 테스트
        run: pytest -q
      - name: 데이터가 생성 스크립트와 일치하는지 확인
        run: |
          python scripts/make_data.py
          git diff --exit-code data eval
      - name: 검색 회귀 검사 (기준 갈래 Recall@3 >= 0.80)
        run: python scripts/eval_retrieval.py configs/retrieval_baseline.yaml --min-recall3 0.80
      - name: 에이전트 회귀 검사 (규칙 기준선, MCP 서버·승인 절차 포함, 과업 성공 >= 60%)
        run: python scripts/eval_agent.py configs/agent_ci.yaml
      - name: 가드레일 과업 (규칙 모델, 숨은 지시 자료·채점·장치가 맞물리는지)
        run: python scripts/eval_agent.py configs/agent_ci_guard.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-report
          path: results/

  # 실제 DB 서버를 띄워 어댑터를 검증한다 (Nori 플러그인은 서비스 컨테이너에서 빌드할 수 없어 standard 분석기로)
  stores-live:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports: ["6333:6333"]
      pgvector:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent" --health-interval 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m"}
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health" --health-interval 10s --health-retries 30
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: node1
        ports: ["8080:8080", "50051:50051"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[stores,dev]"
      - name: 서버 준비 대기
        run: |
          for i in $(seq 1 60); do curl -fs localhost:6333/readyz && curl -fs localhost:8080/v1/.well-known/ready && break; sleep 2; done
      - name: 어댑터 통합 테스트
        env:
          ONPREM_LIVE_STORES: qdrant,pgvector,elasticsearch,weaviate
          ES_ANALYZER: standard
        run: |
          set -o pipefail
          pytest tests/test_stores_live.py -v --tb=line -p no:cacheprovider 2>&1 | tee pytest.log || {
            grep -E "FAILED|Error|error|assert" pytest.log | head -20 | sed 's/^/::error::/'; exit 1; }
