# 벡터DB 5종. 프로필로 골라 띄운다.
#   하나만:  docker compose --profile qdrant up -d
#   전부:    docker compose --profile all up -d      (RAM 약 8~9GB)
#   끄기:    docker compose --profile all down -v    (-v: 데이터까지 삭제)
# 모든 포트는 127.0.0.1 에만 연다 (사내망 밖 노출 방지).

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: [qdrant, all]
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: [milvus, all]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [milvus-etcd:/etcd]

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: [milvus, all]
    environment: {MINIO_ACCESS_KEY: minioadmin, MINIO_SECRET_KEY: minioadmin}
    command: minio server /minio_data
    volumes: [milvus-minio:/minio_data]

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [milvus, all]
    command: ["milvus", "run", "standalone"]
    environment: {ETCD_ENDPOINTS: "milvus-etcd:2379", MINIO_ADDRESS: "milvus-minio:9000"}
    depends_on: [milvus-etcd, milvus-minio]
    ports: ["127.0.0.1:19530:19530"]
    volumes: [milvus:/var/lib/milvus]

  elasticsearch:
    build: {context: docker/elasticsearch}
    image: onprem-agent/elasticsearch-nori:8.17.0
    profiles: [elasticsearch, all]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [es:/usr/share/elasticsearch/data]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    profiles: [weaviate, all]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:50051:50051"]
    volumes: [weaviate:/var/lib/weaviate]

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [pgvector, all]
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]

volumes: {qdrant: {}, milvus-etcd: {}, milvus-minio: {}, milvus: {}, es: {}, weaviate: {}, pg: {}}
