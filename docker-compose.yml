# 벡터DB 5종. 프로필로 골라 띄운다.
#   하나만:  docker compose --profile qdrant up -d
#   전부:    docker compose --profile all up -d      (RAM 약 6~7GB)
#   끄기:    docker compose --profile all down -v    (-v: 데이터까지 삭제)
# 모든 포트는 127.0.0.1 에만 연다 (사내망 밖 노출 방지).

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: [qdrant, all]
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  # Milvus 단독 실행: etcd 내장 + 로컬 디스크 저장 (MinIO 불필요 — MinIO 는 Docker Hub 배포를 중단했다)
  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [milvus, all]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    volumes:
      - milvus:/var/lib/milvus
      - ./docker/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./docker/milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s

  elasticsearch:
    build: {context: docker/elasticsearch}
    image: onprem-agent/elasticsearch-nori:8.17.0
    profiles: [elasticsearch, all]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [es:/usr/share/elasticsearch/data]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    profiles: [weaviate, all]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:50051:50051"]
    volumes: [weaviate:/var/lib/weaviate]

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [pgvector, all]
    environment: {POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: agent}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]

volumes: {qdrant: {}, milvus: {}, es: {}, weaviate: {}, pg: {}}
