# 에이전트 과업 평가 — 규칙 모델만 (GPU·모델 없이 어디서나 돈다, CI 회귀 검사)
#   python scripts/eval_agent.py configs/agent_ci.yaml
name: agent_ci
tasks: eval/agent_tasks.jsonl
embedder: {kind: hash}          # 검색 도구의 임베더. 노트북에서는 bge-m3
