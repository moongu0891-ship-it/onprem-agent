# 에이전트 과업 평가 — 노트북 (RTX 5070 Laptop 8GB). 엔진을 하나씩 띄우고 재고 내린다.
#   python scripts/eval_agent.py configs/agent_laptop.yaml --manage
#   일부만 다시: --only 4B   (이전에 잰 다른 모델 결과는 남는다)
# 질문: ① LLM 이 규칙 기준선보다 나은가(특히 자연스러운 말투) ② 1.7B → 4B 로 키우면 나아지나
#       ③ 엔진에 따라 과업 성공이 달라지나 ④ 그래프의 두 안전 기능(되돌림·근거 자동)가 얼마나 메우나 — 같은 모델을 켜고/끄고 잰다
# 1차(개선 전) 결과: reports/agent_laptop_v1.md. 2차부터 도구 결과의 근거 번호 형식 통일·프롬프트 예시가 모든 줄에 들어가고,
# '(안전 기능 끔)' 줄은 그래프 안전 기능만 끈 것이다.
name: agent_laptop
tasks: eval/agent_tasks.jsonl
embedder: {kind: sentence-transformers, model: BAAI/bge-m3, device: cpu}   # 검색 도구는 2주차 기본값(라우팅 + bge-m3). GPU 는 엔진이 쓰므로 임베딩은 CPU 로
graph: {require_tool: true, auto_cite: true}     # 기본: 두 안전 기능 켬. 모델별 graph 로 덮어쓴다
models:
  - {label: "규칙 기준선", kind: rule}
  - {label: "Qwen3-1.7B · SGLang (안전 기능 끔)", kind: openai, profile: sglang-g16, base_url: "http://localhost:30000/v1", model: qwen3-1.7b,
     graph: {require_tool: false, auto_cite: false}}
  - {label: "Qwen3-1.7B · SGLang", kind: openai, profile: sglang-g16, base_url: "http://localhost:30000/v1", model: qwen3-1.7b}
  - {label: "Qwen3-1.7B · vLLM", kind: openai, profile: vllm, base_url: "http://localhost:8000/v1", model: qwen3-1.7b}
  - {label: "Qwen3-4B(FP8) · SGLang (안전 기능 끔)", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     graph: {require_tool: false, auto_cite: false}}
  - {label: "Qwen3-4B(FP8) · SGLang", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b}
