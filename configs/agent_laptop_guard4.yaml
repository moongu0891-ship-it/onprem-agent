# 에이전트 6주차 ④ — 검색 되돌림 (노트북 RTX 5070 Laptop 8GB)
#   python scripts/eval_agent.py configs/agent_laptop_guard4.yaml --manage
# 계획: agent/README 6.9. 6주차 ③ 의 버린 답(pre_nudge)을 읽으니, 되돌림(업무 기능(도구) 강제 선택)은
#   ① 바르게 거절한 답을 버렸고("고객 재무 정보는 처리할 수 없습니다" → C0051 을 경보 코드로 조회) ② 지어낸 인자('전기', 'C0012')로 엉뚱한 호출을 만들었다.
#   거절 존중은 ① 을 못 잡았고(거절 표현이 목록 밖) 정상 질문의 게으른 "확인할 수 없습니다"를 그대로 내보냈다(g-i3).
# 검색 되돌림: 되돌릴 때 고를 것을 '찾아보기 / 필요 없음' 둘로 줄이고, 찾아보기면 프로그램이 검색 업무 기능(도구)을 질문 그대로 부른다.
#   거절이든 지어내기든 '찾아보지 않고 답한 것'은 모두 찾아본 뒤 다시 답하게 한다. 인자는 프로그램이 정하므로 지어낸 값이 들어갈 틈이 없다.
# 같은 설정 두 번씩(③ 에서 같은 설정이 85%·75% 로 갈렸다).
name: agent_laptop_guard4
tasks: eval/agent_guard_tasks.jsonl
guard_data: true
embedder: {kind: sentence-transformers, model: BAAI/bge-m3, device: cpu}
graph: {require_tool: true, auto_cite: true, safety_search: true, strip_injection: true, answer_guard: true}
models:
  - {label: "Qwen3-4B · 바탕 · 1회", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300}
  - {label: "Qwen3-4B · 바탕 · 2회", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300}
  - {label: "Qwen3-4B · 검색 되돌림 · 1회", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300,
     graph: {require_tool: true, auto_cite: true, safety_search: true, strip_injection: true, answer_guard: true, nudge: search}}
  - {label: "Qwen3-4B · 검색 되돌림 · 2회", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300,
     graph: {require_tool: true, auto_cite: true, safety_search: true, strip_injection: true, answer_guard: true, nudge: search}}
  - {label: "Qwen3-4B · 바탕 · 기존 26과업", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300, tasks_file: eval/agent_tasks.jsonl, guard_data: false}
  - {label: "Qwen3-4B · 검색 되돌림 · 기존 26과업", kind: openai, profile: sglang-4b, base_url: "http://localhost:30000/v1", model: qwen3-4b,
     thinking: true, max_tokens: 2048, timeout: 300, tasks_file: eval/agent_tasks.jsonl, guard_data: false,
     graph: {require_tool: true, auto_cite: true, safety_search: true, strip_injection: true, answer_guard: true, nudge: search}}
