<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 AI 상담</title>
<link rel="stylesheet" href="/static/app.css">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="page">
  <header class="top wrap">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="17" cy="17" r="9" fill="none" stroke="var(--info)" stroke-width="2"/><circle cx="17" cy="17" r="3" fill="var(--warn)"/></svg>
      <div>
        <small>사내 AI 상담 · 회사 밖으로 정보가 나가지 않습니다</small>
        <h1 id="title">상담</h1>
      </div>
    </div>
    <div class="tabs">
      <div class="tabs" id="desks" role="group" aria-label="상담 창구 고르기"></div>
      <button type="button" class="icon-btn" id="theme" aria-label="밝은 화면과 어두운 화면 바꾸기">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 2.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="banner wrap" id="degraded" role="status" hidden>지금은 예비 AI가 답하고 있어요. 평소보다 느리고 정확도가 낮을 수 있으니, 작업 요청 같은 중요한 일은 한 번 더 확인해 주세요.</div>

  <section class="panel path wrap" aria-labelledby="path-title">
    <div class="panel-head">
      <h2 id="path-title">AI가 처리한 순서</h2>
      <span class="muted" style="font-size:12px">상담 번호 <span class="mono" id="thread">—</span></span>
    </div>
    <ol class="steps" id="steps" aria-live="polite"><li class="empty">질문을 보내면 AI가 처리하는 순서가 여기에 차례로 나옵니다.</li></ol>
  </section>

  <main class="panel chat wrap">
    <div class="log" id="log" aria-live="polite">
      <p class="hello" id="hello">무엇을 도와드릴까요? 업무를 바꾸는 일(작업 요청 등록 등)은 실행하기 전에 꼭 확인을 받습니다.</p>
    </div>
    <form class="composer" id="form">
      <label for="ask" class="sr">질문</label>
      <textarea id="ask" rows="2" placeholder="무엇이든 물어보세요"></textarea>
      <button type="submit" class="btn send" id="send">보내기</button>
    </form>
    <div class="foot">
      <span class="note">Enter 로 보내고, Shift+Enter 로 줄을 바꿉니다.</span>
      <button type="button" class="btn small" id="new">새 상담 시작</button>
    </div>
  </main>
</div>
<script src="/static/console.js"></script>
</body>
</html>
