# LiteLLM 게이트웨이 설정.
# 엔진들은 별도 compose 프로필로 뜨므로, 게이트웨이는 호스트 포트(host.docker.internal)로 붙는다.
#
# 이름 규칙
#   agent-llm        에이전트가 쓰는 이름. 1순위 vLLM, 실패하면 llama.cpp 로 넘긴다.
#   vllm / sglang / llamacpp   엔진을 직접 고르는 이름 (측정용)

model_list:
  - model_name: agent-llm
    litellm_params: {model: hosted_vllm/qwen3-1.7b, api_base: "http://host.docker.internal:8000/v1"}
  - model_name: agent-llm-backup
    litellm_params: {model: openai/qwen3-1.7b, api_base: "http://host.docker.internal:18081/v1", api_key: none}
  - model_name: vllm
    litellm_params: {model: hosted_vllm/qwen3-1.7b, api_base: "http://host.docker.internal:8000/v1"}
  - model_name: sglang
    litellm_params: {model: openai/qwen3-1.7b, api_base: "http://host.docker.internal:30000/v1", api_key: none}
  - model_name: llamacpp
    litellm_params: {model: openai/qwen3-1.7b, api_base: "http://host.docker.internal:18081/v1", api_key: none}

router_settings:
  fallbacks: [{"agent-llm": ["agent-llm-backup"]}]
  num_retries: 0          # 같은 엔진 재시도 대신 바로 대체 엔진으로
  timeout: 120

litellm_settings:
  drop_params: false      # ignore_eos·chat_template_kwargs 같은 엔진 고유 옵션을 그대로 넘긴다
